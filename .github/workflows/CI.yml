name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # ProximalBase 0.5, ProximalOPT 0.2 and this CovSel are not registered yet:
      # ProximalBase at the merge of its PR #23 into master (0.5.0, being
      # registered), ProximalOPT at its PR #11 (1f82ae5), and the
      # proximalopt-0.2 branch of CovSel. Julia 1.11 and later take them from
      # [sources] in Project.toml; Julia 1.10 ignores [sources], and resolves
      # each Pkg.add with the whole project, so they are added in one call.
      # Remove the step and [sources] once they are registered.
      - name: Add the unregistered dependencies from GitHub on Julia 1.10
        if: matrix.version == 'lts'
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.add([PackageSpec(url="https://github.com/mlakolar/ProximalBase.jl", rev="51a4caf303804f81edcc13e1fcbf4767ba14f6cb"),
                   PackageSpec(url="https://github.com/mlakolar/ProximalOPT.jl", rev="1f82ae5a30056bd7451b870afde6aec47d556de3"),
                   PackageSpec(url="https://github.com/mlakolar/CovSel.jl", rev="proximalopt-0.2")])
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
